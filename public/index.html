<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Digital Seva Shop — Assistant</title>
<style>
  :root{--bg:#0F1115;--panel:#171A21;--panel2:#1D212B;--border:#262A33;--amber:#E8A93B;--violet:#8B7CF6;--text:#F1EFEA;--muted:#8B8F98;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;min-height:100vh;}
  header{padding:18px;border-bottom:1px solid var(--border);}
  header h1{font-size:17px;margin:0;font-weight:700;}
  header h1 span{color:var(--amber);}
  header p{font-size:12px;color:var(--muted);margin:2px 0 0;}
  #messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;}
  .msg{max-width:82%;border-radius:14px;padding:10px 13px;font-size:14px;line-height:1.5;white-space:pre-wrap;}
  .msg.user{align-self:flex-end;background:var(--violet);color:#fff;}
  .msg.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--border);}
  .row{display:flex;gap:8px;padding:14px;border-top:1px solid var(--border);background:var(--panel2);}
  input{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:11px 13px;color:var(--text);font-size:14px;outline:none;}
  button{background:var(--amber);color:#1A1200;border:none;border-radius:10px;padding:0 18px;font-size:14px;font-weight:700;cursor:pointer;}
  button:disabled{opacity:.6;}
</style>
</head>
<body>
  <header>
    <h1>Digital Seva Shop <span>Assistant</span></h1>
    <p>Aadhar • PAN • Phone-Pe Cash — powered by AutoBuild-X</p>
  </header>
  <div id="messages"></div>
  <div class="row">
    <input id="input" placeholder="Apna sawaal likho..." />
    <button id="send">Send</button>
  </div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  let history = [];

  function addMsg(role, text){
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  addMsg('bot', 'Namaste! 🙏 Aadhar, PAN, ya phone-pe se paise nikalne/bhejne se related koi bhi sawaal poochiye.');

  async function send(){
    const text = inputEl.value.trim();
    if(!text) return;
    addMsg('user', text);
    history.push({role:'user', content:text});
    inputEl.value = '';
    sendBtn.disabled = true;

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({messages: history})
      });
      const data = await res.json();
      const reply = data.reply || 'Kuch gadbad ho gayi.';
      addMsg('bot', reply);
      history.push({role:'assistant', content:reply});
    } catch(e){
      addMsg('bot', 'Server se connect nahi ho paya.');
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.onclick = send;
  inputEl.addEventListener('keydown', e => { if(e.key === 'Enter') send(); });
</script>
</body>
</html>
